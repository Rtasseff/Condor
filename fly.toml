# Condor Funds v2 — Fly.io app config (see docs/LAUNCH-CHECKLIST.md).
# If "condor-funds" is taken when you run `fly launch`, pick another
# name and change it in THREE places: `app` and the two CONDOR_* host
# lines below.
app = "condor-funds"
primary_region = "ewr"   # US East; users elsewhere ride Fly's edge

[build]

[env]
  CONDOR_DEBUG = "0"
  CONDOR_ALLOWED_HOSTS = "condor-funds.fly.dev"
  CONDOR_CSRF_ORIGINS = "https://condor-funds.fly.dev"
  CONDOR_DB_PATH = "/data/db.sqlite3"
  CONDOR_DATA_DIR = "/data/condor"
  CONDOR_SOURCE = "tiingo,yfinance"   # cloud: Tiingo primary (see DEPLOY.md §4)

[[mounts]]
  source = "condor_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"    # always on — no cold starts
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  memory = "2gb"                # comfortable for pandas/cvxpy; ~$12.6/mo
  cpu_kind = "shared"
  cpus = 1
